name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run dependency-free repository validation
        run: make check
      - name: Install CI validation dependencies
        run: python -m pip install --requirement requirements-ci.txt
      - name: Run Apply JSON Schema parity validation
        run: make check-schema
      - name: Run public release privacy validation
        run: make check-public-privacy
      - name: Validate an extracted Gitless source package
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python3 scripts/export_sanitized.py \
            --root . \
            --output "$tmpdir/CodexQB-worktree.zip" \
            --include-untracked \
            --allow-dirty \
            --allow-head-mismatch
          python3 scripts/verify_package_manifest.py --zip "$tmpdir/CodexQB-worktree.zip"
          unzip -q "$tmpdir/CodexQB-worktree.zip" -d "$tmpdir/extracted"
          test ! -e "$tmpdir/extracted/CodexQB/.git"
          cd "$tmpdir/extracted/CodexQB"
          CODEXQB_VALIDATE_SKIP_UNITTESTS=1 \
            CODEXQB_VALIDATE_SKIP_BEHAVIOR_SMOKE=1 \
            bash scripts/validate.sh
